services:
  ftp-target:
    build: ./lab/ftp
    container_name: lab-ftp
    networks:
      lab_net:
        ipv4_address: 172.28.0.10

  dvwa-target:
    image: vulnerables/web-dvwa
    container_name: lab-dvwa
    ports:
      - "127.0.0.1:8080:80"
    networks:
      lab_net:
        ipv4_address: 172.28.0.20

  smb-target:
    build: ./lab/smb
    container_name: lab-smb
    networks:
      lab_net:
        ipv4_address: 172.28.0.30

  kali-attacker:
    build: ./lab/kali
    container_name: lab-kali
    depends_on:
      - ftp-target
      - dvwa-target
      - smb-target
    volumes:
      - ./wordlists:/lab/wordlists:ro
      - ./scripts:/lab/scripts:ro
    networks:
      lab_net:
        ipv4_address: 172.28.0.100

networks:
  lab_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
